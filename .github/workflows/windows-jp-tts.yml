# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: nemo-speech-cpp-windows-cpu-ja

on:
  push:
    branches: [ "voicechat" ]
  pull_request:
    branches: [ "voicechat" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DNEMO_USE_CUDA=OFF \
            -DNEMO_USE_VULKAN=OFF \
            -DNEMO_ENABLE_JAPANESE=ON \
            -DNEMO_TTS_ENABLE_JAPANESE=ON \
            -DNEMO_BUILD_ASR=OFF \
            -DNEMO_SPEECH_BUILD_SERVER=OFF \
            -DNEMO_SPEECH_BUILD_ASR=OFF \
            -DNEMO_SPEECH_BUILD_MIC_CAPTURE=OFF \
            -DNEMO_SPEECH_BUILD_GRPC=OFF \
            -DNEMO_BUILD_TESTS=OFF \
            -DNEMO_BUILD_EXAMPLES=ON \
            -DNEMO_SPEECH_BUILD_HTTP=OFF \
            -DNEMO_ENABLE_TTS=ON \
            -DNEMO_SPEECH_BUILD_DIAR=OFF \
            -DNEMO_SPEECH_BUILD_NMT=OFF \

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel $(nproc)
          
      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Collect generated .exe and .dll files
          find build -type f \( -name "*.exe" -o -name "*.dll" \) -path "*/Release/*" -exec cp {} dist/ \;
          # Collect dictionary files if generated under build/
          find build -type d -name "open_jtalk_dic_utf_8*" -exec cp -r {} dist/ \; 2>/dev/null || true

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: nemo-speech-cpp-windows-cpu-ja
          path: dist/
          if-no-files-found: error
