# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF \
            -DNEMO_USE_CUDA=OFF \
            -DNEMO_BUILD_TESTS=OFF \
            -DNEMO_BUILD_EXAMPLES=ON \
            -NEMO_SPEECH_BUILD_HTTP=OFF \
            -DNEMO_BUILD_ASR=OFF \
            -DNEMO_ENABLE_TTS=ON \
            -DNEMO_ENABLE_TTS=ON \
            -DNEMO_ENABLE_JAPANESE=ON \
            -DNEMO_TTS_ENABLE_JAPANESE=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Collect all binaries, DLLs, and libraries
          find build -type f \( -name "*.exe" -o -name "*.dll" \) -not -path "*/CMakeFiles/*" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: nemo-speech-cpp-windows-cpu-ja
          path: dist/
