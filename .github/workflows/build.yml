name: Build and Test

# Builds ASR, diarization, and TTS on the GitHub-hosted runners, runs the
# model-free ctest suite, then a CLI smoke test with real models.
#
# Coverage per job:
#   Linux CPU    - build, ctest, CPU inference
#   macOS Metal  - Metal backend COMPILE AND LINK only; inference runs on CPU.
#                  The hosted macOS VM's paravirtual GPU cannot run ggml Metal.
#   Windows CPU  - build, ctest, CPU inference
# CUDA and Vulkan run on NVIDIA's self-hosted GPU runners in gpu.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEMO_SPEECH_MODEL_DIR: ${{ github.workspace }}/.ci-models

jobs:
  windows-cpu:
    name: Windows Vulkan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize submodules
        run: git submodule update --init --depth 1 ggml llama.cpp third_party/open_jtalk third_party/cppjieba

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install -y ninja --no-progress
          }
    
      - name: Restore vcpkg binaries
        # actions/cache only saves in its post step when the job succeeds, so
        # a failing test run threw away 30 minutes of dependency builds.
        # Split restore/save and save right after a successful build.
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'scripts/windows/build.ps1') }}
          restore-keys: vcpkg-windows-x64-

      - name: LunarG Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: true
          cache: true
      
      - name: Configure and build
        id: build
        shell: pwsh
        run: |
          scripts\windows\build.ps1 -Backend vulkan -Profile full -TtsJa -TtsZh -Tests -BuildDir "${{ github.workspace }}\build\windows"

      - name: Save vcpkg binaries
        # Keys are immutable, so only save a fully built dependency set. Test
        # failures later in the job do not prevent the save.
        if: steps.build.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

# --- INSPECT BUILD DIR & STAGE ARTIFACTS ---
      - name: Inspect build directory and stage artifacts
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build\windows"
          $distDir  = Join-Path $env:GITHUB_WORKSPACE "dist"

          Write-Host "=== Top-level contents of $buildDir ==="
          Get-ChildItem -Path $buildDir | Select-Object Name, Mode, Length | Format-Table -AutoSize

          Write-Host "=== Locating MeCab / NAIST-jdic / OpenJTalk dictionary data ==="
          Get-ChildItem -Path "$buildDir\*" -Recurse -Include "*open_jtalk*", "*jdic*", "*.dic", "*.bin" | Select-Object FullName

          # 1. Install SDK layout (bin, include, lib, share)
          Write-Host "=== Installing SDK into $distDir ==="
          cmake --install $buildDir --prefix $distDir --config Release

          # 2. Ensure standard directories exist
          @("bin", "include", "lib", "share") | ForEach-Object {
            $dir = Join-Path $distDir $_
            if (-not (Test-Path $dir)) {
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
            }
          }

          # 3. Copy top-level/output static libraries (.lib) if not installed by CMake
          # Note: Avoid recursive search to prevent copying CMake intermediate/compiler files
          Get-ChildItem -Path "$buildDir\bin", "$buildDir\lib" -Filter "*.lib" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "$distDir\lib" -Force
          }

          # 4. Copy compiled OpenJTalk/MeCab binary dictionary (char.bin, matrix.bin, sys.dic, unk.dic)
          $srcDic = Join-Path $buildDir "open_jtalk_dic"
          if (Test-Path $srcDic) {
            Write-Host "Copying compiled open_jtalk_dic..."
            $dest1 = Join-Path $distDir "open_jtalk_dic"
            $dest2 = Join-Path $distDir "bin\open_jtalk_dic"

            New-Item -ItemType Directory -Path $dest1 -Force | Out-Null
            New-Item -ItemType Directory -Path $dest2 -Force | Out-Null

            Copy-Item -Path "$srcDic\*" -Destination $dest1 -Recurse -Force
            Copy-Item -Path "$srcDic\*" -Destination $dest2 -Recurse -Force
          }

          # 5. Copy raw NAIST-jdic source files (naist-jdic.csv, defs)
          $srcDicSrc = Join-Path $buildDir "open_jtalk_dic_src"
          if (Test-Path $srcDicSrc) {
            Write-Host "Copying naist-jdic source files..."
            $destSrc = Join-Path $distDir "open_jtalk_dic_src"
            New-Item -ItemType Directory -Path $destSrc -Force | Out-Null
            Copy-Item -Path "$srcDicSrc\*" -Destination $destSrc -Recurse -Force
          }

          Write-Host "=== Staged contents ready for packaging ==="
          Get-ChildItem -Path $distDir | Select-Object Name, Mode | Format-Table -AutoSize

      # --- UPLOAD ARTIFACT ---
      - name: Upload full package (bin, include, lib, share, and naist-jdic)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nemo-speech-windows-ja-zh-full
          path: dist/
          retention-days: 2

      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build\windows --output-on-failure --timeout 600

      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NEMO_SPEECH_MODEL_DIR }}
          key: models-${{ hashFiles('models/index.json') }}

      - name: Model smoke test
        shell: pwsh
        run: |
          python tests\ci\model_smoke.py `
            --binary build\windows\bin\nemo-speech.exe `
            --backend cpu `
            --audio test_files\asr\wav\test\jfk.wav
